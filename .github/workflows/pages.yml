name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 新版 Vue3 应用数据在构建时打进 bundle（src/data → data/*.json 真源）
      - name: Build shared + web
        run: |
          npm run build:shared
          npm run build:web

      # 组装站点：新版 SPA 在站点根目录；img/ 提供 favicon。
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site/apps/web
          cp -r apps/web/dist/. _site/
          cp -r img _site/img
          # 校验关键产物存在，缺失则构建失败，避免静默产出打不开的站点
          test -f _site/index.html
          test -f _site/img/guangzhou-xuetu-144.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
