<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州七区小学分布 · 升学调研</title>
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  :root {
    --text: #22262E;
    --text-sub: #6B7280;
    --line: rgba(34, 38, 46, 0.10);
    --panel-bg: rgba(255, 255, 255, 0.94);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text);
    background: #E8EBEF;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 信息面板 */
  #panel {
    position: absolute;
    top: 16px; left: 16px;
    width: 240px;
    max-width: calc(100vw - 32px);
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(20, 30, 50, 0.10);
    padding: 14px 16px;
    z-index: 1000;
  }
  #panel h1 {
    font-size: 16px; font-weight: 700; letter-spacing: 0.01em;
  }
  #panel .subtitle {
    font-size: 12px; color: var(--text-sub); margin-top: 3px;
  }
  #status {
    margin-top: 10px; font-size: 13px; line-height: 1.5;
  }
  #status.error { color: #C0392B; }

  #legend { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  #legend .legend-title {
    font-size: 11px; color: var(--text-sub); font-weight: 600; letter-spacing: 0.06em;
    margin-bottom: 7px;
  }
  #legend .row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; padding: 3.5px 0;
  }
  #legend .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.25);
  }
  #legend .count { margin-left: auto; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  #legend .sum { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; font-weight: 600; font-size: 12.5px; }
  #legend .sum .count { color: var(--text); }

  #footnote {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--text-sub); line-height: 1.55;
  }

  /* 学校招生信息卡片 */
  #school-info {
    position: absolute;
    right: 14px; bottom: 14px;
    width: 340px;
    max-width: calc(100vw - 28px);
    max-height: 62vh;
    overflow-y: auto;
    background: rgba(255,255,255,0.97);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(20,30,50,0.16);
    padding: 14px 16px 12px;
    z-index: 1100;
    font-size: 12.5px;
  }
  #si-close {
    position: absolute; top: 8px; right: 10px;
    border: none; background: none;
    font-size: 18px; line-height: 1; color: #8A93A3; cursor: pointer;
    padding: 4px 6px;
  }
  #si-close:hover { color: var(--text); }
  .si-name { font-size: 15px; font-weight: 700; padding-right: 26px; line-height: 1.4; }
  .si-row { margin-top: 8px; display: flex; gap: 8px; }
  .si-row > span:first-child {
    flex: none; width: 76px; color: var(--text-sub); font-size: 11.5px; padding-top: 1px;
  }
  .si-row > b { font-weight: 600; }
  .si-row p { margin: 0; line-height: 1.65; }
  .si-zone { display: block; }
  .si-zone > p { background: #F7F8FA; border-radius: 8px; padding: 8px 10px; margin-top: 2px; }
  .si-src { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; color: #9AA0A6; }
  .si-empty { color: var(--text-sub); margin-top: 6px; }
  .si-hint { color: var(--text-sub); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  a.note-link { color: #1A6BD6; text-decoration: none; border-bottom: 1px dashed #B9CDEA; }
  a.note-link:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    #school-info { right: 10px; bottom: 10px; left: 10px; width: auto; max-height: 55vh; }
  }

  /* 校名提示 */
  .school-label {
    font-size: 11px; line-height: 1.3; color: #333;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    padding: 2px 6px;
    max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* Leaflet 缩放控件样式微调（右下角） */
  .leaflet-control-zoom { border-radius: 8px !important; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.15) !important; }
  .leaflet-control-zoom a { color: #444 !important; }

  @media (max-width: 600px) {
    #panel { top: 10px; left: 10px; width: 210px; padding: 12px 14px; border-radius: 12px; }
    #legend { max-height: 38vh; overflow-y: auto; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" aria-label="统计与图例">
    <h1>广州七区小学分布</h1>
    <div class="subtitle">升学调研 · 数据源：高德地图 POI</div>
    <div id="status"><span id="status-text">正在加载地图…</span></div>
    <div id="legend">
      <div class="legend-title">七区小学点位</div>
      <div id="legend-rows"></div>
      <div class="sum" id="legend-sum" hidden></div>
    </div>
    <div id="footnote">拖动 / 滚轮 / 双指缩放查看。悬停点位显示校名，点击实心点位显示 2026 年招生信息（半透明点位暂无数据）。<br>数据源：高德地图 POI（小学分类+翻页采集，无 100 条限制）· 招生：各区教育局 2026 年官方文件。</div>
  </aside>

  <!-- 学校招生信息卡片（点击点位显示） -->
  <div id="school-info" hidden aria-label="学校招生信息">
    <button id="si-close" aria-label="关闭">×</button>
    <div id="si-body"></div>
  </div>

  <!-- 本地数据：由项目 scripts/ 采集生成 -->
  <script src="../../../data/schools.js"></script>
  <script src="../../../data/enrollments/2026-panyu.js"></script>
  <script src="../../../data/enrollments/2026-liwan.js"></script>
  <script src="../../../data/enrollments/2026-yuexiu.js"></script>
  <script src="../../../data/enrollments/2026-haizhu.js"></script>
  <script src="../../../data/enrollments/2026-tianhe.js"></script>
  <script src="assets/leaflet.js"></script>
  <script>
  (function () {
    'use strict';

    /* ========== 配置 ========== */
    var DISTRICTS = [
      { name: '荔湾区', adcode: '440103', color: '#C0392B' },
      { name: '越秀区', adcode: '440104', color: '#B7950B' },
      { name: '海珠区', adcode: '440105', color: '#27AE60' },
      { name: '天河区', adcode: '440106', color: '#16A085' },
      { name: '白云区', adcode: '440111', color: '#2980B9' },
      { name: '黄埔区', adcode: '440112', color: '#6C3483' },
      { name: '番禺区', adcode: '440113', color: '#C2185B' }
    ];
    var DATA = window.GZ_SCHOOLS || null;

    var map = null;
    var markers = [];
    var unionSW = null, unionNE = null;

    var districtByAdcode = {};
    DISTRICTS.forEach(function (d) { districtByAdcode[d.adcode] = d; });

    /* ========== 工具 ========== */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function setStatus(text, mode) {
      var st = document.getElementById('status');
      var tx = document.getElementById('status-text');
      tx.textContent = text;
      st.className = mode || '';
    }
    function showError(text) {
      setStatus(text, 'error');
      var sum = document.getElementById('legend-sum');
      if (sum) sum.hidden = true;
    }

    /* ========== 地图 ========== */
    function boot() {
      if (typeof L === 'undefined') {
        showError('地图库加载失败：请确认 assets/leaflet.js 与页面在同一目录');
        return;
      }
      if (!DATA) {
        showError('本地数据未加载：请确认 ../../../data/schools.js 与页面在同一目录');
        return;
      }
      map = L.map('map', {
        center: [23.16, 113.35],
        zoom: 10,
        minZoom: 9,
        maxZoom: 18,
        zoomSnap: 0.5,
        zoomControl: false,
        scrollWheelZoom: true
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      // 高德瓦片（GCJ-02 坐标，与本地数据坐标系一致）
      L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        subdomains: ['1', '2', '3', '4'],
        maxZoom: 18,
        attribution: '© 高德地图'
      }).addTo(map);

      try { renderBoundaries(); } catch (e) { showError('区边界渲染失败：' + e); return; }
      try { renderSchools(); } catch (e) { showError('点位渲染失败：' + e); return; }
      try { finalize(); } catch (e) { showError('视野设置失败：' + e); return; }
      updateLegend();
      watchResize();
      watchGesture();
      map.on('zoomend', updateMarkerRadius);
      map.on('click', function (e) {
        // 点在学校点位（path）上时由点位 handler 展示信息，不关闭卡片
        var t = e.originalEvent && e.originalEvent.target;
        if (t && t.classList && t.classList.contains('leaflet-interactive')) return;
        hideSchoolInfo();
      });
      var closeBtn = document.getElementById('si-close');
      if (closeBtn) closeBtn.addEventListener('click', hideSchoolInfo);
    }

    /* ========== 区边界 ========== */
    function renderBoundaries() {
      (DATA.districts || []).forEach(function (dd) {
        var d = districtByAdcode[dd.adcode];
        if (!d) return;
        (dd.boundary || []).forEach(function (path) {
          var latlngs = [];
          path.forEach(function (pt) {
            latlngs.push([pt[1], pt[0]]); // [lat, lng]
            if (!unionSW) {
              unionSW = { lat: pt[1], lng: pt[0] };
              unionNE = { lat: pt[1], lng: pt[0] };
            } else {
              unionSW.lat = Math.min(unionSW.lat, pt[1]);
              unionSW.lng = Math.min(unionSW.lng, pt[0]);
              unionNE.lat = Math.max(unionNE.lat, pt[1]);
              unionNE.lng = Math.max(unionNE.lng, pt[0]);
            }
          });
          L.polygon(latlngs, {
            color: d.color,
            weight: 1.2,
            opacity: 0.75,
            fillColor: d.color,
            fillOpacity: 0.05,
            interactive: false
          }).addTo(map);
        });
      });
    }

    /* ========== 小学点位 ========== */
    // 半径随缩放级别递增：放得越大，点位越醒目
    function radiusForZoom(z) {
      z = Math.round(z);
      if (z >= 15) return 10;
      if (z >= 14) return 9;
      if (z >= 13) return 8;
      if (z >= 12) return 7;
      if (z >= 11) return 6;
      return 5;
    }
    function updateMarkerRadius() {
      var r = radiusForZoom(map.getZoom());
      markers.forEach(function (m) { m.setRadius(r); });
    }
    function renderSchools() {
      (DATA.schools || []).forEach(function (s) {
        var d = districtByAdcode[s.adcode];
        if (!d) return;
        var hasData = !!enrollById[s.name];
        var m = L.circleMarker([s.lat, s.lng], {
          radius: radiusForZoom(map.getZoom()),
          color: hasData ? '#FFFFFF' : 'rgba(255,255,255,0.85)',
          weight: hasData ? 2.4 : 0.8,
          fillColor: d.color,
          fillOpacity: hasData ? 0.95 : 0.25
        }).addTo(map);
        m.bindTooltip(esc(s.name), {
          direction: 'top',
          offset: [0, -8],
          opacity: 0.95,
          className: 'school-label'
        });
        m.on('click', function () { showSchoolInfo(s.name, s.adcode); });
        markers.push(m);
      });
    }

    /* ========== 学校招生信息（点击点位展示） ========== */
    // 备注里的「见说明N」转为跳转材料页的锚点链接（notes.html#explain-N）
    function linkifyNotes(t) {
      return t.replace(/见说明(\d+)(?:、说明(\d+))?/g, function (m, a, b) {
        var links = '<a class="note-link" href="notes.html#explain-' + a + '" target="_blank">见说明' + a + '</a>';
        if (b) links += '、<a class="note-link" href="notes.html#explain-' + b + '" target="_blank">见说明' + b + '</a>';
        return links;
      });
    }
    var ENROLLS = [
      window.GZ_ENROLL_PANYU, window.GZ_ENROLL_LIWAN, window.GZ_ENROLL_YUEXIU,
      window.GZ_ENROLL_HAIZHU, window.GZ_ENROLL_TIANHE
    ].filter(Boolean);
    var enrollById = {};
    var enrollDistricts = {};
    ENROLLS.forEach(function (E) {
      if (E.district) enrollDistricts[E.district] = true;
      (E.records || []).forEach(function (r) {
        if (r.school_id && !enrollById[r.school_id]) enrollById[r.school_id] = r;
      });
    });
    function hideSchoolInfo() {
      var el = document.getElementById('school-info');
      if (el) el.hidden = true;
    }
    function showSchoolInfo(name, adcode) {
      var el = document.getElementById('school-info');
      var body = document.getElementById('si-body');
      if (!el || !body) return;
      var r = enrollById[name];
      var html = '<div class="si-name">' + esc(name) + '</div>';
      if (r) {
        html += '<div class="si-row"><span>学区</span><b>' + esc(r.district) + '</b></div>';
        html += '<div class="si-row"><span>性质</span><b>' + esc(r.nature === '公办' ? '公办（地段入学）' : '民办（电脑派位）') + '</b></div>';
        if (r.plan_classes != null) {
          html += '<div class="si-row"><span>计划班数</span><b>' + esc(String(r.plan_classes)) + ' 个班</b></div>';
        }
        if (r.plan_count != null) {
          html += '<div class="si-row"><span>计划人数</span><b>' + esc(String(r.plan_count)) + ' 人</b></div>';
        }
        html += '<div class="si-row si-zone"><span>招生地段<br>及条件</span><p>' + esc(r.zone || '—') + '</p></div>';
        if (r.note) html += '<div class="si-row"><span>备注</span><p>' + linkifyNotes(esc(r.note)) + '</p></div>';
        html += '<div class="si-src">数据来源：' + esc((r && r.source) || '—') + '</div>';
      } else {
        var districtName = '';
        DISTRICTS.forEach(function (dd) { if (dd.adcode === adcode) districtName = dd.name; });
        var enrolled = enrollDistricts[districtName];
        html += '<div class="si-empty">暂无 2026 年招生数据</div>';
        html += '<div class="si-hint">' + (enrolled
          ? '该点位不在 2026 年' + esc(districtName || '本区') + '公办小学官方名单中（或为名单内学校的别名/分校区，尚未人工核对）。'
          : esc(districtName || '该区') + '的 2026 年招生数据尚未接入（白云、黄埔为低优先级）。') + '</div>';
      }
      body.innerHTML = html;
      el.hidden = false;
    }

    /* ========== 图例与统计 ========== */
    function updateLegend() {
      var rows = document.getElementById('legend-rows');
      var html = '';
      var total = 0;
      DISTRICTS.forEach(function (d) {
        var arr = (DATA.schools || []).filter(function (s) { return s.adcode === d.adcode; });
        var en = arr.filter(function (s) { return enrollById[s.name]; }).length;
        var n = arr.length;
        total += n;
        html += '<div class="row"><span class="dot" style="background:' + d.color + '"></span>' +
                '<span>' + esc(d.name) + '</span><span class="count">' + n + ' 所 · 数据 ' + en + '</span></div>';
      });
      rows.innerHTML = html;
      var sum = document.getElementById('legend-sum');
      sum.hidden = false;
      var dataTotal = (DATA.schools || []).filter(function (s) { return enrollById[s.name]; }).length;
      sum.innerHTML = '<span>合计</span><span class="count">' + total + ' 所 · 数据 ' + dataTotal + '</span>';
      setStatus('已标注 ' + total + ' 所小学（实心=已接入2026招生数据，半透明=暂无）' + (DATA.updated ? ' · ' + esc(DATA.updated) : ''));
    }

    /* ========== 收尾：视野与限制 ========== */
    function finalize() {
      if (unionSW && unionNE) {
        var b = L.latLngBounds([unionSW.lat, unionSW.lng], [unionNE.lat, unionNE.lng]);
        map.fitBounds(b.pad(0.05));
        map.setMaxBounds(b.pad(0.12)); // 拖动范围限制在七区附近
      }
    }

    /* ========== 兜底：容器尺寸变化时重算地图（页面缩放/窗口变化） ========== */
    function invalidateMap() {
      if (map) { try { map.invalidateSize(); } catch (err) {} }
    }
    function watchResize() {
      var el = document.getElementById('map');
      if (!el) return;
      if (window.ResizeObserver) {
        try { new ResizeObserver(invalidateMap).observe(el); } catch (err) {}
      }
      window.addEventListener('resize', invalidateMap);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', invalidateMap);
      }
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) invalidateMap();
      });
    }

    /* ========== 触摸板双指缩放：映射为地图缩放（防止浏览器页面缩放） ========== */
    var gestureLastScale = 1;
    function watchGesture() {
      if (!window.addEventListener) return;
      window.addEventListener('gesturestart', function (e) {
        e.preventDefault();
        gestureLastScale = 1;
      }, { passive: false });
      window.addEventListener('gesturechange', function (e) {
        e.preventDefault();
        if (!map) return;
        var delta = gestureLastScale > 0 ? e.scale / gestureLastScale : 1;
        gestureLastScale = e.scale;
        if (delta > 1.001 || delta < 0.999) {
          var z = map.getZoom() + Math.log2(delta);
          z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
          map.setZoom(z);
        }
      }, { passive: false });
      window.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
    }

    /* ========== 启动 ========== */
    function start() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    }
    start();
    setTimeout(function () {
      if (!map) showError('地图加载失败：请检查 assets/ 与 ../../../data/ 目录是否完整');
    }, 15000);
  })();
  </script>
</body>
</html>
