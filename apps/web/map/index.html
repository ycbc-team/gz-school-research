<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州七区中小学·高中分布 · 升学调研</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://webrd0s.is.autonavi.com">
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  :root {
    --text: #22262E;
    --text-sub: #6B7280;
    --line: rgba(34, 38, 46, 0.10);
    --panel-bg: rgba(255, 255, 255, 0.94);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text);
    background: #E8EBEF;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 信息面板 */
  #panel {
    position: absolute;
    top: 16px; left: 16px;
    width: 248px;
    max-width: calc(100vw - 32px);
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(20, 30, 50, 0.10);
    padding: 14px 16px;
    z-index: 1000;
  }
  #panel h1 {
    font-size: 16px; font-weight: 700; letter-spacing: 0.01em;
  }
  #panel .subtitle {
    font-size: 12px; color: var(--text-sub); margin-top: 3px;
  }
  #status {
    margin-top: 10px; font-size: 13px; line-height: 1.5;
  }
  #status.error { color: #C0392B; }

  .block-title {
    font-size: 11px; color: var(--text-sub); font-weight: 600; letter-spacing: 0.06em;
    margin-bottom: 7px;
  }

  /* 筛选区（图例上方） */
  #filters { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 9px; }
  .f-row {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; padding: 3px 0; cursor: pointer; user-select: none;
  }
  .f-row input { width: 13px; height: 13px; accent-color: #2563EB; flex: none; cursor: pointer; }
  .f-row .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.25);
  }
  .f-row .f-count { margin-left: auto; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .f-btns { display: flex; gap: 6px; margin-top: 6px; }
  .f-btns button {
    flex: 1; font-size: 11.5px; padding: 3px 0;
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    color: var(--text); cursor: pointer;
  }
  .f-btns button:hover { background: #F2F7FF; border-color: #9BBBF4; }

  /* 各区学校数量（小学 / 初中两栏） */
  #dist-stats { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 9px; }
  #dist-rows { display: grid; grid-template-columns: 1fr 46px 46px 46px; column-gap: 6px; row-gap: 2px; font-size: 12px; }
  #dist-rows .d-name { color: var(--text-sub); }
  #dist-rows .d-head { color: var(--text-sub); font-size: 10.5px; font-weight: 600; text-align: right; }
  #dist-rows .d-p, #dist-rows .d-m, #dist-rows .d-h { text-align: right; font-variant-numeric: tabular-nums; }
  #dist-rows .d-p { color: #2563EB; }
  #dist-rows .d-m { color: #DC2626; }
  #dist-rows .d-h { color: #F59E0B; }

  #footnote {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--text-sub); line-height: 1.55;
  }

  /* 学校招生信息卡片 */
  #school-info {
    position: absolute;
    right: 14px; bottom: 14px;
    width: 360px;
    max-width: calc(100vw - 28px);
    max-height: 62vh;
    overflow-y: auto;
    background: rgba(255,255,255,0.97);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(20,30,50,0.16);
    padding: 14px 16px 12px;
    z-index: 1100;
    font-size: 12.5px;
  }
  #si-close {
    position: absolute; top: 8px; right: 10px;
    border: none; background: none;
    font-size: 18px; line-height: 1; color: #8A93A3; cursor: pointer;
    padding: 4px 6px;
  }
  #si-close:hover { color: var(--text); }
  .si-name { font-size: 15px; font-weight: 700; padding-right: 26px; line-height: 1.4; }
  .si-row { margin-top: 8px; display: flex; gap: 8px; }
  .si-row > span:first-child {
    flex: none; width: 76px; color: var(--text-sub); font-size: 11.5px; padding-top: 1px;
  }
  .si-row > b { font-weight: 600; }
  .si-row p { margin: 0; line-height: 1.65; }
  .si-zone { display: block; }
  .si-zone > p { background: #F7F8FA; border-radius: 8px; padding: 8px 10px; margin-top: 2px; }
  .si-src { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; color: #9AA0A6; }
  .si-empty { color: var(--text-sub); margin-top: 6px; }
  .si-hint { color: var(--text-sub); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  /* 支撑度徽标与信号区 */
  .si-tier { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-sub); }
  .si-tier .badge {
    font-size: 12px; font-weight: 700; color: #fff;
    border-radius: 6px; padding: 2px 9px;
  }
  .badge.tier-full { background: #E11D48; }
  .badge.high-city { background: #B45309; }
  .badge.high-dist { background: #0F766E; }
  .badge.high-normal { background: #57534E; }
  .badge.tier-part { background: #F59E0B; }
  .badge.tier-none { background: #8A94A6; }
  .badge.license { background: #4B5563; }
  .si-tier-link { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .si-tier-link a {
    color: #1A6BD6; text-decoration: none; font-size: 12.5px; font-weight: 600;
    border-bottom: 1px dashed #B9CDEA;
  }
  .si-tier-link a:hover { text-decoration: underline; }
  a.note-link { color: #1A6BD6; text-decoration: none; border-bottom: 1px dashed #B9CDEA; }
  a.note-link:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    #school-info { right: 10px; bottom: 10px; left: 10px; width: auto; max-height: 55vh; }
  }

  /* 校名提示 */
  .school-label {
    font-size: 11px; line-height: 1.3; color: #333;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    padding: 2px 6px;
    max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* Leaflet 缩放控件样式微调（右下角） */
  .leaflet-control-zoom { border-radius: 8px !important; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.15) !important; }
  .leaflet-control-zoom a { color: #444 !important; }

  @media (max-width: 600px) {
    #panel { top: 10px; left: 10px; width: 218px; padding: 12px 14px; border-radius: 12px; }
    #filters, #dist-stats { max-height: 30vh; overflow-y: auto; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" aria-label="筛选与统计">
    <h1>广州七区中小学·高中分布</h1>
    <div id="filters">
      <div class="block-title">显示点位（数量随勾选实时统计）</div>
      <label class="f-row"><input type="checkbox" id="f-p-normal" checked><span class="dot" style="background:#94A3B8"></span><span>小学·普通</span><span class="f-count" id="c-pN">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-p-tier" checked><span class="dot" style="background:#2563EB"></span><span>小学·口碑</span><span class="f-count" id="c-pT">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-m-normal" checked><span class="dot" style="background:#A8A29E"></span><span>初中·普通</span><span class="f-count" id="c-mN">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-m-tier" checked><span class="dot" style="background:#DC2626"></span><span>初中·口碑</span><span class="f-count" id="c-mT">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-h-normal" checked><span class="dot" style="background:#64748B"></span><span>高中·普通</span><span class="f-count" id="c-hN">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-h-dist" checked><span class="dot" style="background:#10B981"></span><span>高中·区属示范</span><span class="f-count" id="c-hD">0</span></label>
      <label class="f-row"><input type="checkbox" id="f-h-city" checked><span class="dot" style="background:#F59E0B"></span><span>高中·省市属示范</span><span class="f-count" id="c-hM">0</span></label>
      <div class="f-btns"><button id="f-all" type="button">全选</button><button id="f-none" type="button">全不选</button></div>
    </div>
    <div id="dist-stats">
      <div class="block-title">各区学校 · 小学 / 初中 / 高中</div>
      <div id="dist-rows"></div>
    </div>
    <div id="footnote">拖动 / 滚轮 / 双指缩放查看。悬停显示校名，点击点位显示信息卡。独立法人挂牌校（虚线点）不计入口碑学校，点击详情卡见未计入原因。高中分类口径：省市属示范 / 区属示范 / 普通（详见卡片内“口径”与数据说明）。</div>
  </aside>

  <!-- 学校招生信息卡片（点击点位显示） -->
  <div id="school-info" hidden aria-label="学校招生信息">
    <button id="si-close" aria-label="关闭">×</button>
    <div id="si-body"></div>
  </div>

  <!-- 本地数据：由 scripts/build_combined_data.py 合并生成（9 个源文件 -> 单个 compact 文件，提速首屏） -->
  <script src="../../../data/combined.js"></script>
  <script src="assets/leaflet.js"></script>
  <script>
  (function () {
    'use strict';
    var __t0 = performance.now();   // 性能测量起点（boot 完成后写 window.__bootMs）

    /* ========== 配置 ========== */
    var DISTRICTS = [
      { name: '荔湾区', adcode: '440103', color: '#C0392B' },
      { name: '越秀区', adcode: '440104', color: '#B7950B' },
      { name: '海珠区', adcode: '440105', color: '#27AE60' },
      { name: '天河区', adcode: '440106', color: '#16A085' },
      { name: '白云区', adcode: '440111', color: '#2980B9' },
      { name: '黄埔区', adcode: '440112', color: '#6C3483' },
      { name: '番禺区', adcode: '440113', color: '#C2185B' }
    ];
    var DATA_P = window.GZ_SCHOOLS || null;          // 小学点位
    var TIER1_P = window.GZ_TIER1 || null;           // 小学梯队核验
    var DATA_M = window.GZ_MIDDLE_SCHOOLS || null;   // 初中点位
    var TIER1_M = window.GZ_MIDDLE_TIER1 || null;    // 初中梯队核验
    var DATA_H = window.GZ_HIGH_SCHOOLS || null;     // 高中点位
    var LEVELS_H = window.GZ_HIGH_LEVELS || null;    // 高中分类与指标

    /* ========== 7 类点位配色 ==========
       小学普通 #94A3B8 / 小学口碑 #2563EB / 初中普通 #A8A29E / 初中口碑 #DC2626
       高中普通 #64748B / 高中·区属示范 #10B981 / 高中·省市属示范 #F59E0B
       小学、初中“口碑学校” = 有支撑 ∪ 部分支撑，且排除独立法人挂牌校（tier1_eligible=false）；
       挂牌校以虚线点展示、计入“普通”统计、不占口碑名额，详情卡标注未计入原因；
       有支撑加外圈晕光，部分支撑仅加粗无晕光。
       高中三类按官方“隶属+示范性”划分：省市属示范（省属/市属示范性，含市属优质）、区属示范（区属国家级/市级示范）、普通（其余公办+民办）。 */
    var CLASS_CFG = {
      pN: { stage: 'primary', tier: false, color: '#94A3B8', label: '小学·普通' },
      pT: { stage: 'primary', tier: true,  color: '#2563EB', label: '小学·口碑' },
      mN: { stage: 'middle',  tier: false, color: '#A8A29E', label: '初中·普通' },
      mT: { stage: 'middle',  tier: true,  color: '#DC2626', label: '初中·口碑' },
      hN: { stage: 'high',    tier: false, color: '#64748B', label: '高中·普通' },
      hD: { stage: 'high',    tier: true,  color: '#10B981', label: '高中·区属示范' },
      hM: { stage: 'high',    tier: true,  color: '#F59E0B', label: '高中·省市属示范' }
    };
    var GLOW_COLOR = { primary: 'rgba(37,99,235,0.35)', middle: 'rgba(220,38,38,0.35)' };
    var FILTER_ID = { pN: 'f-p-normal', pT: 'f-p-tier', mN: 'f-m-normal', mT: 'f-m-tier',
                      hN: 'f-h-normal', hD: 'f-h-dist', hM: 'f-h-city' };

    /* ========== 梯队匹配：两学段独立 tierTable（别名匹配表，勿混用） ========== */
    function normName(n, mode) {
      n = String(n == null ? '' : n).replace(/广州市/g, '');
      if (mode === 'primary') {
        n = n.replace(/[（(].*?[)）]/g, '');
      } else {
        n = n.replace(/（/g, '(').replace(/）/g, ')');
      }
      return n.trim();
    }
    function buildTierTable(TIER1, mode) {
      var tbl = [];
      if (TIER1) {
        (TIER1.schools || []).forEach(function (sc) {
          (sc.aliases || []).forEach(function (a) {
            var na = normName(a, mode);
            if (!na) return;
            tbl.push({ k: na, sc: sc });
          });
        });
        tbl.sort(function (x, y) { return y.k.length - x.k.length; });
      }
      return tbl;
    }
    var tierTables = {
      primary: buildTierTable(TIER1_P, 'primary'),
      middle: buildTierTable(TIER1_M, 'middle')
    };
    function tierOf(stage, name) {
      var tbl = tierTables[stage];
      if (!tbl || !tbl.length) return null;
      var n = normName(name, stage);
      var hit = null, i, k;
      for (i = 0; i < tbl.length; i++) {
        k = tbl[i].k;
        if (n === k || (k.length >= 4 && n.indexOf(k) === 0)) { hit = tbl[i].sc; break; }
      }
      return hit;
    }
    function isTierRecord(t) {
      // 独立法人挂牌校（tier1_eligible=false）不计入口碑学校，即使网传判定为有支撑
      return !!t && t.tier1_eligible !== false && (t.verdict === '有支撑' || t.verdict === '部分支撑');
    }
    /* ========== 高中分类查表：按规范校名/别名匹配 levels（避免与小学初中梯队表混用） ========== */
    var highTable = {};
    (function () {
      if (!LEVELS_H) return;
      (LEVELS_H.schools || []).forEach(function (sc) {
        var keys = [sc.name].concat(sc.aliases || []);
        keys.forEach(function (k) {
          var nk = normName(k, 'middle');
          if (nk && !highTable[nk]) highTable[nk] = sc;
        });
        (sc.campuses || []).forEach(function (c) {
          var nk = normName(c, 'middle');
          if (nk && !highTable[nk]) highTable[nk] = sc;
        });
      });
    })();
    function highRecord(pt) {
      var key = normName(pt.school || pt.name, 'middle');
      var rec = highTable[key];
      if (!rec) {  // 兜底：点位名匹配
        var n = normName(pt.name, 'middle');
        Object.keys(highTable).forEach(function (k) {
          if (!rec && n === k) rec = highTable[k];
        });
      }
      return rec || null;
    }
    function highCls(rec) {
      if (!rec) return 'hN';
      if (rec.category === '省市属示范') return 'hM';
      if (rec.category === '区属示范') return 'hD';
      return 'hN';
    }

    var map = null;
    var markers = [];          // 主点位 circleMarker（用于统一调半径）
    var allPoints = [];        // 全部点位（含补点）：{name, lat, lng, adcode, stage, cls, tier}
    var groups = {};           // cls -> L.layerGroup（筛选开关控制整个组显隐）
    var unionSW = null, unionNE = null;

    var districtByAdcode = {};
    DISTRICTS.forEach(function (d) { districtByAdcode[d.adcode] = d; });
    var adcodeByDistrict = {};
    DISTRICTS.forEach(function (d) { adcodeByDistrict[d.name] = d.adcode; });

    /* ========== 工具 ========== */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function setStatus(text, mode) {
      var st = document.getElementById('status');
      var tx = document.getElementById('status-text');
      if (!st || !tx) return;   // 状态行已从面板移除，仅保留错误兜底逻辑
      tx.textContent = text;
      st.className = mode || '';
    }
    function showError(text) {
      setStatus(text, 'error');
    }
    function districtNameOf(adcode) {
      var d = districtByAdcode[adcode];
      return d ? d.name : '';
    }

    /* ========== 地图 ========== */
    function boot() {
      if (typeof L === 'undefined') {
        showError('地图库加载失败：请确认 assets/leaflet.js 与页面在同一目录');
        return;
      }
      if (!DATA_P) {
        showError('小学数据未加载：请确认 ../../../data/primary/schools.js 与页面在同一目录');
        return;
      }
      if (!DATA_M) {
        showError('初中数据未加载：请确认 ../../../data/middle/schools.js 与页面在同一目录');
        return;
      }
      if (!DATA_H) {
        showError('高中数据未加载：请确认 ../../../data/high/schools.js 与页面在同一目录');
        return;
      }
      Object.keys(CLASS_CFG).forEach(function (k) { groups[k] = L.layerGroup(); });
      var cc0 = coreCenter();
      map = L.map('map', {
        center: cc0 || [23.16, 113.35],
        zoom: cc0 ? INITIAL_ZOOM : 10,
        minZoom: 9,
        maxZoom: 18,
        zoomSnap: 0.5,
        zoomControl: false,
        scrollWheelZoom: true,
        preferCanvas: true   // 大量点位用 Canvas 渲染（SVG DOM 元素开销大，首屏慢的主因）
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      // 高德瓦片（GCJ-02 坐标，与本地数据坐标系一致）
      L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        subdomains: ['1', '2', '3', '4'],
        maxZoom: 18,
        attribution: '© 高德地图'
      }).addTo(map);

      try { renderBoundaries(); } catch (e) { showError('区边界渲染失败：' + e); return; }
      try { renderSchools(); } catch (e) { showError('点位渲染失败：' + e); return; }
      try { finalize(); } catch (e) { showError('视野设置失败：' + e); return; }
      // 默认全部勾选：4 个分组全部上地图
      Object.keys(groups).forEach(function (k) { groups[k].addTo(map); });
      updateLegend();
      initFilters();
      watchResize();
      watchGesture();
      map.on('zoomend', updateMarkerRadius);
      // 性能与调试钩子（只读，供控制台与验证脚本使用）
      window.__bootMs = Math.round(performance.now() - __t0);
      window.__mapStats = function () {
        var vis = 0;
        Object.keys(CLASS_CFG).forEach(function (k) {
          var g = groups[k];
          if (!g || !map.hasLayer(g)) return;
          g.getLayers().forEach(function (l) {
            if (l.options && l.options.interactive === false) return;  // 晕圈不计
            vis++;
          });
        });
        return { all: allPoints.length, visible: vis };
      };
      window.__hitTest = function (cls) {
        // 返回该类全部点位在容器内的像素坐标（跳过晕圈，供自动化点击验证）
        var g = groups[cls];
        if (!g) return [];
        var out = [];
        g.getLayers().forEach(function (l) {
          if (l.options && l.options.interactive === false) return;
          var p = map.latLngToContainerPoint(l.getLatLng());
          out.push({ x: Math.round(p.x), y: Math.round(p.y) });
        });
        return out;
      };
      map.on('click', function (e) {
        // 点在学校点位（path）上时由点位 handler 展示信息，不关闭卡片
        // （Canvas 模式下点位命中由点位 handler 的 stopPropagation 阻止冒泡到此）
        var t = e.originalEvent && e.originalEvent.target;
        if (t && t.classList && t.classList.contains('leaflet-interactive')) return;
        hideSchoolInfo();
      });
      var closeBtn = document.getElementById('si-close');
      if (closeBtn) closeBtn.addEventListener('click', hideSchoolInfo);
    }

    /* ========== 区边界（小学/初中同边界，用小学一套） ========== */
    function renderBoundaries() {
      (DATA_P.districts || []).forEach(function (dd) {
        var d = districtByAdcode[dd.adcode];
        if (!d) return;
        (dd.boundary || []).forEach(function (path) {
          var latlngs = [];
          path.forEach(function (pt) {
            latlngs.push([pt[1], pt[0]]); // [lat, lng]
            if (!unionSW) {
              unionSW = { lat: pt[1], lng: pt[0] };
              unionNE = { lat: pt[1], lng: pt[0] };
            } else {
              unionSW.lat = Math.min(unionSW.lat, pt[1]);
              unionSW.lng = Math.min(unionSW.lng, pt[0]);
              unionNE.lat = Math.max(unionNE.lat, pt[1]);
              unionNE.lng = Math.max(unionNE.lng, pt[0]);
            }
          });
          L.polygon(latlngs, {
            color: d.color,
            weight: 1.2,
            opacity: 0.75,
            fillColor: d.color,
            fillOpacity: 0.05,
            interactive: false
          }).addTo(map);
        });
      });
    }

    /* ========== 点位渲染 ========== */
    function radiusForZoom(z) {
      z = Math.round(z);
      if (z >= 15) return 10;
      if (z >= 14) return 9;
      if (z >= 13) return 8;
      if (z >= 12) return 7;
      if (z >= 11) return 6;
      return 5;
    }
    function updateMarkerRadius() {
      var r = radiusForZoom(map.getZoom());
      markers.forEach(function (m) { m.setRadius(r); });
    }
    function markerStyle(cls, tier) {
      var cfg = CLASS_CFG[cls];
      var s = {
        radius: radiusForZoom(map.getZoom()),
        color: 'rgba(255,255,255,0.85)',
        weight: 1.2,
        fillColor: cfg.color,
        fillOpacity: 1,
        bubblingMouseEvents: false   // 点位事件不冒泡到 map（避免点开信息卡后立即被 map click 关闭）
      };
      if (!cfg.tier) {
        s.fillOpacity = 0.7;   // 普通点位半透明
        s.weight = 1.2;
      } else {
        s.weight = (tier && tier.verdict === '有支撑') ? 2.8 : 2.2;  // 有支撑加粗
      }
      if (tier && tier.tier1_eligible === false) {
        // 独立法人挂牌校：虚线描边，地图上一眼可辨，但不占“口碑学校”名额
        s.dashArray = '4 3';
        s.fillOpacity = 0.85;
      }
      return s;
    }
    // 高德 POI 无主点位、经 Amap Web API 补充坐标的梯队学校（tier1.js 内 coords）
    function extraPoints(TIER1, stage) {
      var out = [];
      if (TIER1) {
        (TIER1.schools || []).forEach(function (sc) {
          if (!sc.coords) return;
          out.push({
            name: sc.name,
            lat: sc.coords.lat,
            lng: sc.coords.lng,
            adcode: adcodeByDistrict[sc.district] || '',
            stage: stage
          });
        });
      }
      return out;
    }
    function addPoint(pt, renderedTier) {
      var tier = null;
      if (pt.stage === 'high') {
        // 高中：按 levels 分类定三类颜色
        var rec = highRecord(pt);
        pt.tier = rec;
        pt.cls = highCls(rec);
      } else {
        tier = tierOf(pt.stage, pt.name);
        pt.tier = tier;
        if (tier) renderedTier[tier.name] = true;
        var isTier = isTierRecord(tier);
        pt.cls = (pt.stage === 'primary') ? (isTier ? 'pT' : 'pN') : (isTier ? 'mT' : 'mN');
      }
      var g = groups[pt.cls];
      var m = L.circleMarker([pt.lat, pt.lng], markerStyle(pt.cls, tier)).addTo(g);
      if (tier && tier.verdict === '有支撑' && tier.tier1_eligible !== false) {
        // 有支撑：外侧再加一圈晕光，更醒目（挂牌校不叠加晕光，避免误读为梯队）
        L.circleMarker([pt.lat, pt.lng], {
          radius: radiusForZoom(map.getZoom()) + 4,
          color: GLOW_COLOR[pt.stage],
          weight: 2,
          fill: false,
          interactive: false
        }).addTo(g);
      }
      m.bindTooltip(esc(pt.name) + ((tier && tier.tier1_eligible === false) ? ' · 挂牌校' : ''), {
        direction: 'top',
        offset: [0, -8],
        opacity: 0.95,
        className: 'school-label'
      });
      m.on('click', function (e) {
        // Canvas 模式下阻止 DOM 冒泡，避免 map click 把刚打开的信息卡关掉
        if (e && e.originalEvent && e.originalEvent.stopPropagation) e.originalEvent.stopPropagation();
        showSchoolInfo(pt);
      });
      markers.push(m);
      allPoints.push(pt);
    }
    function renderSchools() {
      var renderedTier = { primary: {}, middle: {} };
      (DATA_P.schools || []).forEach(function (s) {
        if (!districtByAdcode[s.adcode]) return;
        addPoint({ name: s.name, lat: s.lat, lng: s.lng, adcode: s.adcode, stage: 'primary' }, renderedTier.primary);
      });
      (DATA_M.schools || []).forEach(function (s) {
        if (!districtByAdcode[s.adcode]) return;
        addPoint({ name: s.name, lat: s.lat, lng: s.lng, adcode: s.adcode, stage: 'middle' }, renderedTier.middle);
      });
      (DATA_H.schools || []).forEach(function (s) {
        if (!districtByAdcode[s.adcode]) return;
        addPoint({ name: s.name, lat: s.lat, lng: s.lng, adcode: s.adcode, stage: 'high', school: s.school }, {});
      });
      // 补点：小学 3 所 + 初中 14 所，归入对应学段
      extraPoints(TIER1_P, 'primary').forEach(function (es) {
        if (renderedTier.primary[es.name]) return;
        addPoint(es, renderedTier.primary);
      });
      extraPoints(TIER1_M, 'middle').forEach(function (es) {
        if (renderedTier.middle[es.name]) return;
        addPoint(es, renderedTier.middle);
      });
    }

    /* ========== 筛选（实时控制点位显示） ========== */
    function filterOn(cls) {
      var el = document.getElementById(FILTER_ID[cls]);
      return el ? el.checked : true;
    }
    function applyFilters() {
      Object.keys(CLASS_CFG).forEach(function (cls) {
        var g = groups[cls];
        if (!g || !map) return;
        var on = filterOn(cls);
        if (on) { if (!map.hasLayer(g)) g.addTo(map); }
        else { if (map.hasLayer(g)) map.removeLayer(g); }
      });
    }
    function initFilters() {
      Object.keys(FILTER_ID).forEach(function (cls) {
        var el = document.getElementById(FILTER_ID[cls]);
        if (el) el.addEventListener('change', applyFilters);
      });
      var all = document.getElementById('f-all');
      var none = document.getElementById('f-none');
      if (all) all.addEventListener('click', function () { setAllFilters(true); });
      if (none) none.addEventListener('click', function () { setAllFilters(false); });
    }
    function setAllFilters(v) {
      Object.keys(FILTER_ID).forEach(function (cls) {
        var el = document.getElementById(FILTER_ID[cls]);
        if (el) el.checked = v;
      });
      applyFilters();
    }

    /* ========== 学校招生信息（点击点位展示） ========== */
    // 备注里的「见说明N」转为跳转材料页的锚点链接（notes.html#explain-N）
    function linkifyNotes(t) {
      return t.replace(/见说明(\d+)(?:、说明(\d+))?/g, function (m, a, b) {
        var links = '<a class="note-link" href="notes.html#explain-' + a + '" target="_blank">见说明' + a + '</a>';
        if (b) links += '、<a class="note-link" href="notes.html#explain-' + b + '" target="_blank">见说明' + b + '</a>';
        return links;
      });
    }
    var ENROLLS = [
      window.GZ_ENROLL_PANYU, window.GZ_ENROLL_LIWAN, window.GZ_ENROLL_YUEXIU,
      window.GZ_ENROLL_HAIZHU, window.GZ_ENROLL_TIANHE
    ].filter(Boolean);
    var enrollById = {};
    var enrollDistricts = {};
    ENROLLS.forEach(function (E) {
      if (E.district) enrollDistricts[E.district] = true;
      (E.records || []).forEach(function (r) {
        if (r.school_id && !enrollById[r.school_id]) enrollById[r.school_id] = r;
      });
    });
    function hideSchoolInfo() {
      var el = document.getElementById('school-info');
      if (el) el.hidden = true;
    }
    function siRow(label, contentHtml, kind) {
      if (kind === 'b') return '<div class="si-row"><span>' + label + '</span><b>' + contentHtml + '</b></div>';
      if (kind === 'zone') return '<div class="si-row si-zone"><span>' + label + '</span><p>' + contentHtml + '</p></div>';
      return '<div class="si-row"><span>' + label + '</span><p>' + contentHtml + '</p></div>';
    }
    function showSchoolInfo(pt) {
      var el = document.getElementById('school-info');
      var body = document.getElementById('si-body');
      if (!el || !body) return;
      var name = pt.name;
      var stage = pt.stage;
      var tier = pt.tier;
      var districtName = districtNameOf(pt.adcode);
      var html = '<div class="si-name">' + esc(name) + '</div>';

      if (stage === 'high') {
        // 高中：类别徽标 + 隶属/示范性 + 高考出口指标 + 录取门槛
        var rec = pt.tier;
        if (rec) {
          var ind = rec.indicators || {};
          var badgeCls2 = rec.category === '省市属示范' ? 'high-city' : (rec.category === '区属示范' ? 'high-dist' : 'high-normal');
          html += '<div class="si-tier"><span class="badge ' + badgeCls2 + '">' + esc(rec.category) + '</span>' +
                  '<span>' + esc(rec.demo || '') + ' · ' + esc(rec.affiliation || '') + '</span></div>';
          if (ind.tekong_2026) html += siRow('特控线上线率 2026', esc(ind.tekong_2026), 'b');
          if (ind.tekong_2025) html += siRow('特控线上线率 2025', esc(ind.tekong_2025), 'b');
          if (ind.tekong) html += siRow('特控率（网传）', esc(ind.tekong), 'b');
          if (ind.gaofen_2026) html += siRow('高分段 2026', esc(ind.gaofen_2026));
          if (ind.gaofen_2025) html += siRow('高分段 2025', esc(ind.gaofen_2025));
          if (ind.benke_2026) html += siRow('本科率 2026', esc(ind.benke_2026), 'b');
          if (ind.benke_2025) html += siRow('本科率 2025', esc(ind.benke_2025), 'b');
          if (ind.score_2025) html += siRow('2025中考录取线<br>（户籍生）', esc(ind.score_2025), 'b');
          if (ind.note) html += siRow('备注', esc(ind.note));
          html += '<div class="si-src">口径：特控线=特殊类型招生控制线（高优线）；率为各校喜报/网传数据，非官方统一发布。分类依据：2026名额分配名单+2025录取线表。</div>';
        } else {
          html += '<div class="si-row"><span>学段</span><b>高中</b></div>';
          html += '<div class="si-row"><span>所在区</span><b>' + esc(districtName || '—') + '</b></div>';
          html += '<div class="si-hint">该点位暂未匹配到高中分类（可能为未收录学校）。</div>';
        }
      } else if (tier) {
        // 支撑度区块：网传梯队标签 + 具体支撑信号 + 说明页链接
        var v = tier.verdict || '';
        if (tier.tier1_eligible === false) {
          // 独立法人挂牌校：未计入口碑学校，展示原因说明标志
          html += '<div class="si-tier"><span class="badge badge-license">独立法人挂牌校</span>' +
                  '<span>网传“口碑学校”· 独立法人，未计入口碑学校</span></div>';
          if (tier.exclude_reason) html += siRow('未计入原因', esc(tier.exclude_reason), 'zone');
        } else {
          var badgeCls = v === '有支撑' ? 'tier-full' : (v === '部分支撑' ? 'tier-part' : 'tier-none');
          html += '<div class="si-tier"><span class="badge ' + badgeCls + '">' + esc(v) + '</span>' +
                  '<span>网传“口碑学校”· 民间口径非官方</span></div>';
          if (tier.entity_relation === '同法人校区') html += siRow('校区关系', '同法人校区 · 与本部同一法人', 'b');
        }
        var sg = tier.signals || {};
        if (stage === 'primary') {
          if (sg.xiaoshengchu) html += siRow('出口机制', esc(sg.xiaoshengchu));
          if (sg.education_group) html += siRow('教育集团', esc(sg.education_group));
          if (sg.plan_classes_2026 != null) html += siRow('2026班数', esc(String(sg.plan_classes_2026)) + ' 个班', 'b');
          if (sg.degree_warning) html += siRow('学位预警', esc(sg.degree_warning), 'b');
          if (sg.provincial_level_title) html += siRow('省一级', esc(sg.provincial_level_title), 'b');
        } else {
          if (sg.zhongkao) html += siRow('中考成绩', esc(sg.zhongkao));
          if (sg.demonstration_high) html += siRow('示范性高中', esc(sg.demonstration_high), 'b');
          if (sg.education_group) html += siRow('教育集团', esc(sg.education_group));
          if (sg.founded) html += siRow('建校年份', esc(sg.founded), 'b');
          if (sg.quota_allocation) html += siRow('指标到校', esc(sg.quota_allocation), 'zone');
        }
        if (tier.conclusion_basis) html += siRow('判定依据', esc(tier.conclusion_basis), 'zone');
        html += '<div class="si-tier-link"><a href="../support.html" target="_blank">查看“支撑度”说明页 →</a></div>';
      } else {
        // 普通校：学段提示 + 区名
        html += '<div class="si-row"><span>学段</span><b>' + (stage === 'primary' ? '小学' : (stage === 'middle' ? '初中' : '高中')) + '</b></div>';
        html += '<div class="si-row"><span>所在区</span><b>' + esc(districtName || '—') + '</b></div>';
      }
      body.innerHTML = html;
      el.hidden = false;
    }

    /* ========== 图例与统计（随筛选实时更新） ========== */
    function updateLegend() {
      // 数量为全量总览，不随勾选变化；勾选只控制地图点位显隐
      var counts = { pN: 0, pT: 0, mN: 0, mT: 0, hN: 0, hD: 0, hM: 0 };
      var pDist = {}, mDist = {}, hDist = {};
      allPoints.forEach(function (pt) {
        counts[pt.cls]++;
        var d = districtByAdcode[pt.adcode];
        if (!d) return;
        if (pt.stage === 'primary') pDist[d.name] = (pDist[d.name] || 0) + 1;
        else if (pt.stage === 'middle') mDist[d.name] = (mDist[d.name] || 0) + 1;
        else hDist[d.name] = (hDist[d.name] || 0) + 1;
      });
      // 筛选器行内数量（全量）
      ['pN', 'pT', 'mN', 'mT', 'hN', 'hD', 'hM'].forEach(function (cls) {
        var el = document.getElementById('c-' + cls);
        if (el) el.textContent = counts[cls];
      });
      // 各区学校：小学 / 初中 / 高中 三栏（全量）
      var dr = document.getElementById('dist-rows');
      if (dr) {
        var html = '<div class="d-head"></div><div class="d-head">小学</div><div class="d-head">初中</div><div class="d-head">高中</div>';
        DISTRICTS.forEach(function (d) {
          html += '<div class="d-name">' + esc(d.name.replace('区', '')) + '</div>' +
                  '<div class="d-p">' + (pDist[d.name] || 0) + '</div>' +
                  '<div class="d-m">' + (mDist[d.name] || 0) + '</div>' +
                  '<div class="d-h">' + (hDist[d.name] || 0) + '</div>';
        });
        dr.innerHTML = html;
      }
      // 状态栏：全量标注数量
      var total = counts.pN + counts.pT + counts.mN + counts.mT + counts.hN + counts.hD + counts.hM;
      setStatus('已标注 ' + total + ' 所：小学 ' + (counts.pN + counts.pT) + ' · 初中 ' + (counts.mN + counts.mT) +
                ' · 高中 ' + (counts.hN + counts.hD + counts.hM));
    }

    /* ========== 收尾：视野与限制 ========== */
    // 中心城区（默认视野聚焦范围）：荔湾 / 越秀 / 海珠 / 天河
    var CORE_ADCODES = { '440103': true, '440104': true, '440105': true, '440106': true };
    var INITIAL_ZOOM = 13; // 初始视野固定缩放级别（不随窗口大小自适应，打开即聚焦中心城区）
    function coreCenter() {
      var sw = null, ne = null;
      (DATA_P.districts || []).forEach(function (dd) {
        if (!CORE_ADCODES[dd.adcode]) return;
        (dd.boundary || []).forEach(function (path) {
          path.forEach(function (pt) {
            if (!sw) { sw = { lat: pt[1], lng: pt[0] }; ne = { lat: pt[1], lng: pt[0] }; }
            else {
              sw.lat = Math.min(sw.lat, pt[1]); sw.lng = Math.min(sw.lng, pt[0]);
              ne.lat = Math.max(ne.lat, pt[1]); ne.lng = Math.max(ne.lng, pt[0]);
            }
          });
        });
      });
      return sw ? [(sw.lat + ne.lat) / 2, (sw.lng + ne.lng) / 2] : null;
    }
    function finalize() {
      if (unionSW && unionNE) {
        var b = L.latLngBounds([unionSW.lat, unionSW.lng], [unionNE.lat, unionNE.lng]);
        if (!coreCenter()) {
          // 兜底：核心四区数据缺失时退化为七区全景（固定级别，无动画）
          map.fitBounds(b.pad(0.05), { animate: false });
          map.setZoom(map.getZoom() + 1);
        }
        map.setMaxBounds(b.pad(0.5)); // 拖动范围限制：七区并集 + 50% 内边距
      }
    }

    /* ========== 兜底：容器尺寸变化时重算地图（页面缩放/窗口变化） ========== */
    function invalidateMap() {
      if (map) { try { map.invalidateSize(); } catch (err) {} }
    }
    function watchResize() {
      var el = document.getElementById('map');
      if (!el) return;
      if (window.ResizeObserver) {
        try { new ResizeObserver(invalidateMap).observe(el); } catch (err) {}
      }
      window.addEventListener('resize', invalidateMap);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', invalidateMap);
      }
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) invalidateMap();
      });
    }

    /* ========== 触摸板双指缩放：映射为地图缩放（防止浏览器页面缩放） ========== */
    var gestureLastScale = 1;
    function watchGesture() {
      if (!window.addEventListener) return;
      window.addEventListener('gesturestart', function (e) {
        e.preventDefault();
        gestureLastScale = 1;
      }, { passive: false });
      window.addEventListener('gesturechange', function (e) {
        e.preventDefault();
        if (!map) return;
        var delta = gestureLastScale > 0 ? e.scale / gestureLastScale : 1;
        gestureLastScale = e.scale;
        if (delta > 1.001 || delta < 0.999) {
          var z = map.getZoom() + Math.log2(delta);
          z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
          map.setZoom(z);
        }
      }, { passive: false });
      window.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
    }

    /* ========== 启动 ========== */
    function start() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    }
    start();
    setTimeout(function () {
      if (!map) showError('地图加载失败：请检查 assets/ 与 ../../../data/ 目录是否完整');
    }, 15000);
  })();
  </script>
