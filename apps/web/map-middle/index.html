<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州八区初中分布 · 升学调研</title>
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  :root {
    --text: #22262E;
    --text-sub: #6B7280;
    --line: rgba(34, 38, 46, 0.10);
    --panel-bg: rgba(255, 255, 255, 0.94);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text);
    background: #E8EBEF;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 信息面板 */
  #panel {
    position: absolute;
    top: 16px; left: 16px;
    width: 240px;
    max-width: calc(100vw - 32px);
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(20, 30, 50, 0.10);
    padding: 14px 16px;
    z-index: 1000;
  }
  #panel h1 {
    font-size: 16px; font-weight: 700; letter-spacing: 0.01em;
  }
  #panel .subtitle {
    font-size: 12px; color: var(--text-sub); margin-top: 3px;
  }
  #status {
    margin-top: 10px; font-size: 13px; line-height: 1.5;
  }
  #status.error { color: #C0392B; }

  #legend { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  #legend .legend-title {
    font-size: 11px; color: var(--text-sub); font-weight: 600; letter-spacing: 0.06em;
    margin-bottom: 7px;
  }
  #legend .row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; padding: 3.5px 0;
  }
  #legend .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.25);
  }
  #legend .count { margin-left: auto; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  #legend .sum { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; font-weight: 600; font-size: 12.5px; }
  #legend .sum .count { color: var(--text); }

  #footnote {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--text-sub); line-height: 1.55;
  }

  /* 学校信息卡片 */
  #school-info {
    position: absolute;
    right: 14px; bottom: 14px;
    width: 360px;
    max-width: calc(100vw - 28px);
    max-height: 62vh;
    overflow-y: auto;
    background: rgba(255,255,255,0.97);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(20,30,50,0.16);
    padding: 14px 16px 12px;
    z-index: 1100;
    font-size: 12.5px;
  }
  #si-close {
    position: absolute; top: 8px; right: 10px;
    border: none; background: none;
    font-size: 18px; line-height: 1; color: #8A93A3; cursor: pointer;
    padding: 4px 6px;
  }
  #si-close:hover { color: var(--text); }
  .si-name { font-size: 15px; font-weight: 700; padding-right: 26px; line-height: 1.4; }
  .si-row { margin-top: 8px; display: flex; gap: 8px; }
  .si-row > span:first-child {
    flex: none; width: 76px; color: var(--text-sub); font-size: 11.5px; padding-top: 1px;
  }
  .si-row > b { font-weight: 600; }
  .si-row p { margin: 0; line-height: 1.65; }
  .si-zone { display: block; }
  .si-zone > p { background: #F7F8FA; border-radius: 8px; padding: 8px 10px; margin-top: 2px; }
  .si-src { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 10.5px; color: #9AA0A6; }
  .si-empty { color: var(--text-sub); margin-top: 6px; }
  .si-hint { color: var(--text-sub); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  /* 支撑度徽标与信号区 */
  .si-tier { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-sub); }
  .si-tier .badge {
    font-size: 12px; font-weight: 700; color: #fff;
    border-radius: 6px; padding: 2px 9px;
  }
  .badge.tier-full { background: #E11D48; }
  .badge.tier-part { background: #F59E0B; }
  .badge.tier-none { background: #8A94A6; }
  .si-tier-link { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .si-tier-link a {
    color: #1A6BD6; text-decoration: none; font-size: 12.5px; font-weight: 600;
    border-bottom: 1px dashed #B9CDEA;
  }
  .si-tier-link a:hover { text-decoration: underline; }
  .legend-link { margin-top: 9px; padding-top: 7px; border-top: 1px dashed var(--line); }
  .legend-link a {
    color: #1A6BD6; text-decoration: none; font-size: 12px; font-weight: 600;
    border-bottom: 1px dashed #B9CDEA;
  }
  .legend-link a:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    #school-info { right: 10px; bottom: 10px; left: 10px; width: auto; max-height: 55vh; }
  }

  /* 校名提示 */
  .school-label {
    font-size: 11px; line-height: 1.3; color: #333;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    padding: 2px 6px;
    max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* Leaflet 缩放控件样式微调（右下角） */
  .leaflet-control-zoom { border-radius: 8px !important; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.15) !important; }
  .leaflet-control-zoom a { color: #444 !important; }

  @media (max-width: 600px) {
    #panel { top: 10px; left: 10px; width: 210px; padding: 12px 14px; border-radius: 12px; }
    #legend { max-height: 38vh; overflow-y: auto; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" aria-label="统计与图例">
    <h1>广州八区初中分布</h1>
    <div class="subtitle">升学调研 · 数据源：高德地图 POI</div>
    <div id="status"><span id="status-text">正在加载地图…</span></div>
    <div id="legend">
      <div class="legend-title">点位颜色：支撑度</div>
      <div id="legend-rows"></div>
      <div class="sum" id="legend-sum" hidden></div>
      <div id="legend-link"></div>
    </div>
    <div id="footnote">拖动 / 滚轮 / 双指缩放查看。悬停显示校名，点击点位显示信息卡：网传梯队校会给出支撑信号（中考成绩、示范性高中、教育集团、建校年份等）与判定依据，并链接到“支撑度”说明页。<br>数据源：高德地图 POI（初中/中学分类+翻页采集，无 100 条限制）· 梯队标签核验：各区教育局与官方公开信息（口径见支撑度说明页）。</div>
  </aside>

  <!-- 学校信息卡片（点击点位显示） -->
  <div id="school-info" hidden aria-label="学校信息">
    <button id="si-close" aria-label="关闭">×</button>
    <div id="si-body"></div>
  </div>

  <!-- 本地数据：由项目 scripts/ 采集生成 -->
  <script src="../../../data/middle/schools.js"></script>
  <script src="../../../data/middle/tier1.js"></script>
  <script src="assets/leaflet.js"></script>
  <script>
  (function () {
    'use strict';

    /* ========== 配置 ========== */
    var DISTRICTS = [
      { name: '荔湾区', adcode: '440103', color: '#C0392B' },
      { name: '越秀区', adcode: '440104', color: '#B7950B' },
      { name: '海珠区', adcode: '440105', color: '#27AE60' },
      { name: '天河区', adcode: '440106', color: '#16A085' },
      { name: '白云区', adcode: '440111', color: '#2980B9' },
      { name: '黄埔区', adcode: '440112', color: '#6C3483' },
      { name: '番禺区', adcode: '440113', color: '#C2185B' },
      { name: '增城区', adcode: '440118', color: '#2E86C1' }
    ];
    var DATA = window.GZ_MIDDLE_SCHOOLS || null;
    var TIER1 = window.GZ_MIDDLE_TIER1 || null;

    /* ========== 支撑度（民间梯队标签核验结果）点位配色 ========== */
    var TIER_COLORS = {
      '有支撑':   { fill: '#E11D48', color: '#E11D48', opacity: 1,   weight: 3.2, glow: true  },  // 更抢眼：深红
      '部分支撑': { fill: '#F59E0B', color: '#F59E0B', opacity: 1,   weight: 2.6, glow: false },  // 抢眼：琥珀
      'default':  { fill: '#8A94A6', color: '#8A94A6', opacity: 0.75, weight: 1.3, glow: false }   // 普通：中性灰蓝
    };
    // 校名匹配表：tier1.js 预生成的别名（含校区/简称变体，已剔除通用短词）-> 学校记录（长别名优先，避免短前缀抢先）
    // 与 scripts/build_middle_tier1_js.py 的 norm_paren 保持一致：去「广州市」前缀、括号归一为半角、保留校区信息
    var tierTable = [];
    function normName(n) {
      return String(n == null ? '' : n)
        .replace(/广州市/g, '').replace(/（/g, '(').replace(/）/g, ')').trim();
    }
    if (TIER1) {
      (TIER1.schools || []).forEach(function (sc) {
        (sc.aliases || []).forEach(function (a) {
          var na = normName(a);
          if (!na) return;
          tierTable.push({ k: na, sc: sc });
        });
      });
      tierTable.sort(function (x, y) { return y.k.length - x.k.length; });
    }
    function tierOf(name) {
      if (!tierTable.length) return null;
      var n = normName(name);
      var hit = null, i, k;
      for (i = 0; i < tierTable.length; i++) {
        k = tierTable[i].k;
        if (n === k || (k.length >= 4 && n.indexOf(k) === 0)) { hit = tierTable[i].sc; break; }
      }
      return hit;
    }
    function tierStyle(name) {
      var t = tierOf(name);
      var v = t ? t.verdict : null;
      var s = TIER_COLORS[v] || TIER_COLORS.default;
      return { style: s, record: t };
    }

    var map = null;
    var markers = [];
    var unionSW = null, unionNE = null;

    var districtByAdcode = {};
    DISTRICTS.forEach(function (d) { districtByAdcode[d.adcode] = d; });
    var adcodeByDistrict = {};
    DISTRICTS.forEach(function (d) { adcodeByDistrict[d.name] = d.adcode; });
    // 高德 POI 无主点位、经 Amap Web API（v3/place/text）补充坐标的梯队学校（tier1.js 内 coords）
    var extraSchools = [];
    if (TIER1) {
      (TIER1.schools || []).forEach(function (sc) {
        if (!sc.coords) return;
        extraSchools.push({
          name: sc.name,
          lat: sc.coords.lat,
          lng: sc.coords.lng,
          district: sc.district,
          adcode: adcodeByDistrict[sc.district] || ''
        });
      });
    }

    /* ========== 工具 ========== */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function setStatus(text, mode) {
      var st = document.getElementById('status');
      var tx = document.getElementById('status-text');
      tx.textContent = text;
      st.className = mode || '';
    }
    function showError(text) {
      setStatus(text, 'error');
      var sum = document.getElementById('legend-sum');
      if (sum) sum.hidden = true;
    }

    /* ========== 地图 ========== */
    function boot() {
      if (typeof L === 'undefined') {
        showError('地图库加载失败：请确认 assets/leaflet.js 与页面在同一目录');
        return;
      }
      if (!DATA) {
        showError('本地数据未加载：请确认 ../../../data/middle/schools.js 与页面在同一目录');
        return;
      }
      var cc0 = coreCenter();
      map = L.map('map', {
        center: cc0 || [23.16, 113.35],
        zoom: cc0 ? INITIAL_ZOOM : 10,
        minZoom: 9,
        maxZoom: 18,
        zoomSnap: 0.5,
        zoomControl: false,
        scrollWheelZoom: true
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      // 高德瓦片（GCJ-02 坐标，与本地数据坐标系一致）
      L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        subdomains: ['1', '2', '3', '4'],
        maxZoom: 18,
        attribution: '© 高德地图'
      }).addTo(map);

      try { renderBoundaries(); } catch (e) { showError('区边界渲染失败：' + e); return; }
      try { renderSchools(); } catch (e) { showError('点位渲染失败：' + e); return; }
      try { finalize(); } catch (e) { showError('视野设置失败：' + e); return; }
      updateLegend();
      watchResize();
      watchGesture();
      map.on('zoomend', updateMarkerRadius);
      map.on('click', function (e) {
        // 点在学校点位（path）上时由点位 handler 展示信息，不关闭卡片
        var t = e.originalEvent && e.originalEvent.target;
        if (t && t.classList && t.classList.contains('leaflet-interactive')) return;
        hideSchoolInfo();
      });
      var closeBtn = document.getElementById('si-close');
      if (closeBtn) closeBtn.addEventListener('click', hideSchoolInfo);
    }

    /* ========== 区边界 ========== */
    function renderBoundaries() {
      (DATA.districts || []).forEach(function (dd) {
        var d = districtByAdcode[dd.adcode];
        if (!d) return;
        (dd.boundary || []).forEach(function (path) {
          var latlngs = [];
          path.forEach(function (pt) {
            latlngs.push([pt[1], pt[0]]); // [lat, lng]
            if (!unionSW) {
              unionSW = { lat: pt[1], lng: pt[0] };
              unionNE = { lat: pt[1], lng: pt[0] };
            } else {
              unionSW.lat = Math.min(unionSW.lat, pt[1]);
              unionSW.lng = Math.min(unionSW.lng, pt[0]);
              unionNE.lat = Math.max(unionNE.lat, pt[1]);
              unionNE.lng = Math.max(unionNE.lng, pt[0]);
            }
          });
          L.polygon(latlngs, {
            color: d.color,
            weight: 1.2,
            opacity: 0.75,
            fillColor: d.color,
            fillOpacity: 0.05,
            interactive: false
          }).addTo(map);
        });
      });
    }

    /* ========== 初中点位 ========== */
    // 半径随缩放级别递增：放得越大，点位越醒目
    function radiusForZoom(z) {
      z = Math.round(z);
      if (z >= 15) return 10;
      if (z >= 14) return 9;
      if (z >= 13) return 8;
      if (z >= 12) return 7;
      if (z >= 11) return 6;
      return 5;
    }
    function updateMarkerRadius() {
      var r = radiusForZoom(map.getZoom());
      markers.forEach(function (m) { m.setRadius(r); });
    }
    function renderSchools() {
      var renderedTier = {};
      (DATA.schools || []).forEach(function (s) {
        var d = districtByAdcode[s.adcode];
        if (!d) return;
        var ts = tierStyle(s.name);
        if (ts.record) renderedTier[ts.record.name] = true;
        // 点位颜色统一按“支撑度”区分：普通初中中性色，部分支撑琥珀，有支撑深红
        var m = L.circleMarker([s.lat, s.lng], {
          radius: radiusForZoom(map.getZoom()),
          color: 'rgba(255,255,255,0.85)',
          weight: ts.style.weight,
          fillColor: ts.style.fill,
          fillOpacity: ts.style.opacity
        }).addTo(map);
        if (ts.style.glow) {
          // 有支撑：外侧再加一圈深红晕圈，更醒目
          L.circleMarker([s.lat, s.lng], {
            radius: radiusForZoom(map.getZoom()) + 4,
            color: 'rgba(225,29,72,0.35)',
            weight: 2,
            fill: false,
            interactive: false
          }).addTo(map);
        }
        m.bindTooltip(esc(s.name), {
          direction: 'top',
          offset: [0, -8],
          opacity: 0.95,
          className: 'school-label'
        });
        m.on('click', function () { showSchoolInfo(s.name, s.adcode); });
        markers.push(m);
      });
      // 高德 API 补充点位：POI 无主点位但已查到坐标的梯队学校
      extraSchools.forEach(function (es) {
        if (renderedTier[es.name]) return;
        var ts = tierStyle(es.name);
        var m = L.circleMarker([es.lat, es.lng], {
          radius: radiusForZoom(map.getZoom()),
          color: 'rgba(255,255,255,0.85)',
          weight: ts.style.weight,
          fillColor: ts.style.fill,
          fillOpacity: ts.style.opacity
        }).addTo(map);
        if (ts.style.glow) {
          L.circleMarker([es.lat, es.lng], {
            radius: radiusForZoom(map.getZoom()) + 4,
            color: 'rgba(225,29,72,0.35)',
            weight: 2,
            fill: false,
            interactive: false
          }).addTo(map);
        }
        m.bindTooltip(esc(es.name), {
          direction: 'top',
          offset: [0, -8],
          opacity: 0.95,
          className: 'school-label'
        });
        m.on('click', function () { showSchoolInfo(es.name, es.adcode); });
        markers.push(m);
      });
    }

    /* ========== 学校信息（点击点位展示） ========== */
    function hideSchoolInfo() {
      var el = document.getElementById('school-info');
      if (el) el.hidden = true;
    }
    function showSchoolInfo(name, adcode) {
      var el = document.getElementById('school-info');
      var body = document.getElementById('si-body');
      if (!el || !body) return;
      var html = '<div class="si-name">' + esc(name) + '</div>';

      // 支撑度区块：网传梯队标签 + 具体支撑信号 + 说明页链接
      var tier = tierOf(name);
      if (tier) {
        var v = tier.verdict || '';
        var badgeCls = v === '有支撑' ? 'tier-full' : (v === '部分支撑' ? 'tier-part' : 'tier-none');
        html += '<div class="si-tier"><span class="badge ' + badgeCls + '">' + esc(v) + '</span>' +
                '<span>网传“' + esc(tier.rumor_tier || '第一梯队') + '”· 民间口径非官方</span></div>';
        var sg = tier.signals || {};
        if (sg.zhongkao) {
          html += '<div class="si-row"><span>中考成绩</span><p>' + esc(sg.zhongkao) + '</p></div>';
        }
        if (sg.demonstration_high) {
          html += '<div class="si-row"><span>示范性高中</span><b>' + esc(sg.demonstration_high) + '</b></div>';
        }
        if (sg.education_group) {
          html += '<div class="si-row"><span>教育集团</span><p>' + esc(sg.education_group) + '</p></div>';
        }
        if (sg.founded) {
          html += '<div class="si-row"><span>建校年份</span><b>' + esc(sg.founded) + '</b></div>';
        }
        if (sg.quota_allocation) {
          html += '<div class="si-row si-zone"><span>指标到校</span><p>' + esc(sg.quota_allocation) + '</p></div>';
        }
        if (tier.conclusion_basis) {
          html += '<div class="si-row si-zone"><span>判定依据</span><p>' + esc(tier.conclusion_basis) + '</p></div>';
        }
        html += '<div class="si-tier-link"><a href="../../support.html" target="_blank">查看“支撑度”说明页 →</a></div>';
      } else {
        var districtName = '';
        DISTRICTS.forEach(function (dd) { if (dd.adcode === adcode) districtName = dd.name; });
        html += '<div class="si-empty">该点位不在 57 所网传第一梯队初中名单内</div>';
        html += '<div class="si-hint">' + esc(districtName || '该区') + '普通初中点位。网传梯队名单为民间口径，未上榜不代表学校实力评价。</div>';
      }
      body.innerHTML = html;
      el.hidden = false;
    }

    /* ========== 图例与统计 ========== */
    function updateLegend() {
      var rows = document.getElementById('legend-rows');
      var html = '';
      var total = 0;
      var distCount = {};
      var tierCount = { '有支撑': 0, '部分支撑': 0 };
      (DATA.schools || []).forEach(function (s) {
        var d = districtByAdcode[s.adcode];
        if (!d) return;
        total++;
        distCount[d.name] = (distCount[d.name] || 0) + 1;
        var t = tierOf(s.name);
        if (t && tierCount[t.verdict] != null) tierCount[t.verdict]++;
      });
      // 高德 API 补充点位计入统计（普通数不变，仅撑大梯队点位与合计）
      extraSchools.forEach(function (es) {
        total++;
        if (es.district) distCount[es.district] = (distCount[es.district] || 0) + 1;
        var t = tierOf(es.name);
        if (t && tierCount[t.verdict] != null) tierCount[t.verdict]++;
      });
      var highlighted = tierCount['有支撑'] + tierCount['部分支撑'];
      var plain = total - highlighted;
      var legendDefs = [
        { color: TIER_COLORS['有支撑'].color,   label: '有支撑（网传 44 所）', count: tierCount['有支撑'], suffix: ' 点位' },
        { color: TIER_COLORS['部分支撑'].color, label: '部分支撑（网传 13 所）', count: tierCount['部分支撑'], suffix: ' 点位' },
        { color: TIER_COLORS.default.color,     label: '普通初中', count: plain, suffix: ' 所' }
      ];
      legendDefs.forEach(function (ld) {
        html += '<div class="row"><span class="dot" style="background:' + ld.color + '"></span>' +
                '<span>' + ld.label + '</span><span class="count">' + ld.count + ld.suffix + '</span></div>';
      });
      html += '<div class="row"><span class="dot" style="background:transparent;box-shadow:none;"></span>' +
              '<span>合计点位</span><span class="count">' + total + ' 所</span></div>';
      // 各区数量（纯文本，不再用颜色区分）
      var distLine = DISTRICTS.map(function (d) {
        return d.name.replace('区', '') + ' ' + (distCount[d.name] || 0);
      }).join(' · ');
      html += '<div style="font-size:11px;color:var(--text-sub);line-height:1.6;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);">' +
              esc(distLine) + '</div>';
      rows.innerHTML = html;
      var sum = document.getElementById('legend-sum');
      sum.hidden = false;
      sum.innerHTML = '<span>合计</span><span class="count">' + total + ' 所初中</span>';
      var legendLink = document.getElementById('legend-link');
      if (legendLink) {
        legendLink.innerHTML = '<a href="../../support.html" target="_blank">“支撑度”是什么？说明页 →</a>';
      }
      setStatus('已标注 ' + total + ' 所初中：深红=有支撑 · 琥珀=部分支撑 · 灰=普通' + (DATA.updated ? ' · ' + esc(DATA.updated) : ''));
    }

    /* ========== 收尾：视野与限制 ========== */
    // 中心城区（默认视野聚焦范围）：荔湾 / 越秀 / 海珠 / 天河
    var CORE_ADCODES = { '440103': true, '440104': true, '440105': true, '440106': true };
    var INITIAL_ZOOM = 13; // 初始视野固定缩放级别（不随窗口大小自适应，打开即聚焦中心城区）
    function coreCenter() {
      var sw = null, ne = null;
      (DATA.districts || []).forEach(function (dd) {
        if (!CORE_ADCODES[dd.adcode]) return;
        (dd.boundary || []).forEach(function (path) {
          path.forEach(function (pt) {
            if (!sw) { sw = { lat: pt[1], lng: pt[0] }; ne = { lat: pt[1], lng: pt[0] }; }
            else {
              sw.lat = Math.min(sw.lat, pt[1]); sw.lng = Math.min(sw.lng, pt[0]);
              ne.lat = Math.max(ne.lat, pt[1]); ne.lng = Math.max(ne.lng, pt[0]);
            }
          });
        });
      });
      return sw ? [(sw.lat + ne.lat) / 2, (sw.lng + ne.lng) / 2] : null;
    }
    function finalize() {
      if (unionSW && unionNE) {
        var b = L.latLngBounds([unionSW.lat, unionSW.lng], [unionNE.lat, unionNE.lng]);
        if (!coreCenter()) {
          // 兜底：核心四区数据缺失时退化为八区全景（固定级别，无动画）
          map.fitBounds(b.pad(0.05), { animate: false });
          map.setZoom(map.getZoom() + 1);
        }
        map.setMaxBounds(b.pad(0.5)); // 拖动范围限制：八区并集 + 50% 内边距
      }
    }

    /* ========== 兜底：容器尺寸变化时重算地图（页面缩放/窗口变化） ========== */
    function invalidateMap() {
      if (map) { try { map.invalidateSize(); } catch (err) {} }
    }
    function watchResize() {
      var el = document.getElementById('map');
      if (!el) return;
      if (window.ResizeObserver) {
        try { new ResizeObserver(invalidateMap).observe(el); } catch (err) {}
      }
      window.addEventListener('resize', invalidateMap);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', invalidateMap);
      }
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) invalidateMap();
      });
    }

    /* ========== 触摸板双指缩放：映射为地图缩放（防止浏览器页面缩放） ========== */
    var gestureLastScale = 1;
    function watchGesture() {
      if (!window.addEventListener) return;
      window.addEventListener('gesturestart', function (e) {
        e.preventDefault();
        gestureLastScale = 1;
      }, { passive: false });
      window.addEventListener('gesturechange', function (e) {
        e.preventDefault();
        if (!map) return;
        var delta = gestureLastScale > 0 ? e.scale / gestureLastScale : 1;
        gestureLastScale = e.scale;
        if (delta > 1.001 || delta < 0.999) {
          var z = map.getZoom() + Math.log2(delta);
          z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
          map.setZoom(z);
        }
      }, { passive: false });
      window.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
    }

    /* ========== 启动 ========== */
    function start() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    }
    start();
    setTimeout(function () {
      if (!map) showError('地图加载失败：请检查 assets/ 与 ../../../data/ 目录是否完整');
    }, 15000);
  })();
  </script>
</body>
</html>
